<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RA – Reports App</title>
<style>
:root{--bg:#e9eee9;--fg:#14212b;--mu:#566570;--pr:#1f4e79;--pd:#143a5c;--cd:#fff;--bd:#d3dbd5;--ok:#1d7a46;--no:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--fg:#e8eef2;--mu:#98a8b3;--pr:#5b9bd5;--pd:#3b73a3;--cd:#1a242c;--bd:#2c3a45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--fg:#e8eef2;--mu:#98a8b3;--pr:#5b9bd5;--pd:#3b73a3;--cd:#1a242c;--bd:#2c3a45;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:8px}
.lg{display:flex;align-items:center;gap:8px;font:700 22px Georgia,serif}
.logo{background:#000;color:#fff;font:800 15px system-ui;padding:9px 8px;border-radius:10px}
main{padding:0 16px 90px;max-width:560px;margin:auto}
h1{font:700 30px/1.15 Georgia,serif;margin:12px 0}h2{font:700 22px Georgia,serif;margin:8px 0}h3{margin:12px 0 6px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--fg);font:inherit;margin:4px 0 8px}
label{font-size:14px;color:var(--mu);font-weight:600}
button{font:inherit;cursor:pointer;border-radius:10px;padding:11px 16px;border:1px solid var(--pr);background:none;color:var(--pr);font-weight:600}
.b{background:var(--pr);color:#fff}.b3{background:var(--pr);color:#fff;border:0;box-shadow:0 5px 0 var(--pd),0 8px 12px #0003;padding:14px 22px;width:100%;margin:8px 0 12px}
.b3:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pd)}
.x{border-color:var(--no);color:var(--no)}.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:#16275a;color:#fff;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.app{display:flex;align-items:center;gap:14px;padding:14px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;margin:8px 0;cursor:pointer;font-weight:700}
.app i{font-style:normal;font-size:26px}.app em{margin-left:auto;background:var(--no);color:#fff;border-radius:99px;padding:1px 9px;font-size:13px;font-style:normal}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.tabs button{background:var(--cd)}
.mu{color:var(--mu);font-size:14px}.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}.chip.r{background:var(--no);color:#fff}.chip.a{background:var(--ok);color:#fff}
.wa{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#25a244;color:#fff;padding:13px 18px;border-radius:99px;font-weight:700;text-decoration:none;box-shadow:0 4px 14px #0004}
.md{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:5}.md .cd{width:100%;max-width:380px}
.rep img{width:100%;border-radius:8px}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid var(--bd)}
ol li{margin:4px 0}.ck{display:inline-flex;gap:6px;align-items:center;margin:4px 10px 4px 0}.ck input{width:auto;margin:0}
@media print{header,.wa,.nop{display:none}}
:root{--bg:#fff;--fg:#000;--mu:#555;--pr:#000;--pd:#000;--cd:#fff;--bd:#000;--ok:#000;--no:#000}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#fff;--mu:#aaa;--pr:#fff;--pd:#fff;--cd:#000;--bd:#fff;--ok:#fff;--no:#fff}}
:root[data-theme="dark"]{--bg:#000;--fg:#fff;--mu:#aaa;--pr:#fff;--pd:#fff;--cd:#000;--bd:#fff;--ok:#fff;--no:#fff}
input,select,textarea{border:2px solid var(--fg)}textarea{width:100%;padding:12px;border-radius:10px;background:var(--cd);color:var(--fg);font:inherit}
button,.app{border:2px solid var(--fg);color:var(--fg);background:var(--cd);box-shadow:0 5px 0 var(--fg);margin-bottom:7px}
button:active,.app:active{transform:translateY(4px);box-shadow:0 1px 0 var(--fg)}
.b,.ok,.b3{background:var(--fg);color:var(--bg);box-shadow:0 5px 0 var(--mu)}.x{border-color:var(--fg);color:var(--fg);border-style:dashed}
.cd{border:2px solid var(--fg)}.av{background:var(--fg);color:var(--bg)}.logo{border:2px solid var(--fg)}.app em,.chip.r,.chip.a{background:var(--fg);color:var(--bg)}
.wa{background:var(--fg);color:var(--bg);box-shadow:0 5px 0 var(--mu)}.gt{margin:8px 0}.gt td{border:1px solid var(--fg)}
:root{--t1:#fff;--t2:#dcdcdc;--s1:#000;--g1:#4a4a4a;--g2:#000;--gt:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--t1:#2e2e2e;--t2:#000;--s1:#fff;--g1:#fff;--g2:#b5b5b5;--gt:#000}}
:root[data-theme="dark"]{--t1:#2e2e2e;--t2:#000;--s1:#fff;--g1:#fff;--g2:#b5b5b5;--gt:#000}
button,.app{position:relative;background:linear-gradient(var(--t1),var(--t2));border:2px solid var(--s1);border-radius:12px;box-shadow:inset 0 2px 0 #ffffff80,inset 0 -3px 0 #00000026,0 3px 0 var(--s1),0 6px 0 var(--s1),0 12px 14px #0005;margin:0 4px 14px 0;transition:transform .12s,box-shadow .12s}
button:hover:not(:disabled),.app:hover{transform:translateY(-2px);box-shadow:inset 0 2px 0 #ffffff80,inset 0 -3px 0 #00000026,0 5px 0 var(--s1),0 8px 0 var(--s1),0 16px 18px #0005}
button:active,.app:active{transform:translateY(6px);box-shadow:inset 0 3px 6px #0006,0 0 0 var(--s1),0 1px 2px #0005}
.b,.ok,.b3{background:linear-gradient(var(--g1),var(--g2));color:var(--gt);box-shadow:inset 0 2px 0 #ffffff55,inset 0 -3px 0 #00000040,0 3px 0 var(--mu),0 6px 0 var(--s1),0 12px 14px #0005}
.b3{margin-bottom:16px}.tabs{gap:12px;padding-bottom:6px}.x{border-style:solid}
button:disabled{opacity:.4}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D={schools:[]};try{D=JSON.parse(localStorage.getItem('ra1'))||D}catch(_){}
let fs=null,lastJ={};
const save=()=>{try{localStorage.setItem('ra1',JSON.stringify(D))}catch(_){alert('Storage is full – try a smaller image.')}
 if(fs)D.schools.forEach(s=>{const j=JSON.stringify(s);if(lastJ[s.id]!==j){lastJ[s.id]=j;fs.collection('schools').doc(s.id).set(s)}})};
const H=s=>{let h=5381;for(const c of String(s).trim())h=(h*33)^c.charCodeAt(0);return(h>>>0).toString(36)};
const uid=()=>Math.random().toString(36).slice(2,9);
const CATS={Nursery:['Baby','Middle','Top'],Primary:[1,2,3,4,5,6,7].map(n=>'P.'+n),Secondary:[1,2,3,4,5,6].map(n=>'S.'+n)};
const TERMS=['Term 1','Term 2','Term 3'];
let ui={},ses={};
const sc=id=>D.schools.find(s=>s.id===id),cur=()=>sc(location.hash.slice(1).split('-')[1]);
const go=h=>{location.hash=h.replace(/^#?\/?/,'').replace(/\//g,'-')};addEventListener('hashchange',()=>{ui={};render()});
const v=i=>($('#'+i)||{}).value||'';
const av=s=>`<div class=av>${s.b?`<img src="${s.b}" alt="">`:e(s.n.slice(0,2).toUpperCase())}</div>`;
const tabs=(a,k,f)=>`<div class=tabs>${a.map(x=>`<button data-v="${e(x.v??x)}" onclick="ui.${k}=this.dataset.v;render()">${e(x.l??(f?f(x):x))}</button>`).join('')}</div>`;
const img=(f,w)=>new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const i=new Image;i.onload=()=>{const k=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.src=fr.result};fr.readAsDataURL(f)});

function render(){const[p,a,b]=location.hash.slice(2).split('/'),s=sc(a),solo=b==='i';let h;
 if(p==='reg')h=reg();else if(p==='admin')h=adm();else if(p==='s'&&s)h=sch(s,b);else h=home();
 $('#app').innerHTML=`<header>${solo?`<button onclick="go('#/')">☰ More</button>`:`<div class=lg><span class=logo>RA.</span></div>`}<button onclick="go('#/reg')">Register a school</button></header><main>${h}</main><a class=wa href="https://wa.me/256769408254" target="_blank" rel="noopener">💬 Contact Developer</a>`}

/* HOME */
function home(){return`<h1>How school reports work</h1><ol><li><b>Find the school</b> and open its page.</li><li><b>Enter the access code</b> the school gave you.</li><li><b>Tap a term</b> to read the report.</li></ol><label>School name</label><input id=q placeholder="Type a school name" oninput="hq(this.value)" value="${e(ui.q||'')}"><div id=list>${lst()}</div>`}
function hq(x){if(x.trim()==='Millioniare2027'){go('#/admin');return}ui.q=x;$('#list').innerHTML=lst()}
function lst(){const q=(ui.q||'').toLowerCase().trim(),L=D.schools.filter(s=>s.status==='approved'&&s.n.toLowerCase().includes(q));
 return L.map(s=>`<div class=row onclick="go('#/s/${s.id}/p')">${av(s)}<b>${e(s.n)}</b></div>`).join('')+(q&&!L.length?`<p class=mu>No registered school found for “${e(ui.q)}”.</p><button class=b3 onclick="go('#/reg')">Register school</button>`:'')}

/* REGISTER */
function reg(){return`<h2>Register a school</h2><div class=cd><label>School name</label><input id=rn><label>Badge</label><input id=rb type=file accept="image/*"><label>School categories</label><div>${Object.keys(CATS).map(c=>`<label class=ck><input type=checkbox class=rc value="${c}">${c}</label>`).join('')}</div><label>Director email</label><input id=re type=email><label>Director password</label><input id=rd type=password><label>School passcode (for the dashboard)</label><input id=rp type=password><label>Teachers password</label><input id=rt type=password><button class=b3 onclick="doReg()">Submit for approval</button><button onclick="go('#/')">Cancel</button></div>`}
async function doReg(){const n=v('rn').trim(),cs=[...document.querySelectorAll('.rc:checked')].map(x=>x.value),f=$('#rb').files[0];
 if(!n||!cs.length||!v('re')||!v('rd')||!v('rp')||!v('rt'))return alert('Fill every field and pick at least one category.');
 const s={id:uid(),n,b:f?await img(f,120):'',cl:cs.flatMap(c=>CATS[c]),em:v('re'),dp:H(v('rd')),sp:H(v('rp')),tp:H(v('rt')),status:'pending',tc:[],rc:[],stu:[],rep:[]};
 D.schools.push(s);save();alert('Registered. Waiting for RA admin approval.');go('#/')}

/* ADMIN */
function adm(){const L=D.schools;return`<h2>App admin</h2><button onclick="go('#/')">‹ Home</button>${L.map(s=>`<div class=cd><div class=row style="border:0;cursor:default">${av(s)}<div><b>${e(s.n)}</b><div class=mu>${e(s.em)} · <span class="chip ${s.status==='approved'?'a':s.status==='disabled'?'r':''}">${s.status}</span></div></div></div>
 ${s.status!=='approved'?`<button class=ok onclick="st('${s.id}','approved')">${s.status==='pending'?'Approve':'Enable'}</button> `:`<button class=x onclick="st('${s.id}','disabled')">Disable</button> `}<button onclick="np('${s.id}')">New school passcode</button> <button onclick="cp('${s.id}')">Copy school link</button></div>`).join('')||'<p class=mu>No schools yet.</p>'}`}
function st(i,x){sc(i).status=x;save();render()}
function np(i){const p=prompt('New passcode for this school:');if(p){sc(i).sp=H(p);save();alert('Passcode changed.')}}
function cp(i){const u=location.href.split('#')[0]+'#/s/'+i+'/i';(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>alert('Link copied:\n'+u),()=>prompt('Copy this school link:',u))}

/* SCHOOL ACCESS */
function sch(s,b){const solo=b==='i',pop=b==='p'||ui.pop;
 if(s.status!=='approved')return`<div class=cd><h2>${e(s.n)}</h2><p>${s.status==='pending'?'Waiting for admin approval.':'This school is disabled.'}</p></div>`;
 const V=ui.v||'access';
 if(V==='dl')return dlog(s);if(V==='dash')return dash(s);if(V==='tpw')return tpw(s);if(V==='tl')return tlog(s);if(V==='td')return tdash(s);
 if(V==='par')return`<h2>${e(s.n)}</h2><button onclick="ui={};render()">‹ Exit</button>`+vw(s,ui.ps);
 const box=`<div style="text-align:center">${av(s).replace('class=av','class=av style="margin:auto;width:72px;height:72px;font-size:24px"')}<h2>${e(s.n)}</h2></div><label>${pop?'Enter passcode':'School or student passcode'}</label><input id=ac type=password placeholder="Passcode" onkeydown="event.key==='Enter'&&acc()"><button class=b3 onclick="acc()">Open</button><button onclick="ui.v='tpw';render()">Teachers access</button>`;
 const md=`<div class=md><div class=cd>${box}<button onclick="${solo?'ui.pop=0;render()':"go('#/')"}">Close</button></div></div>`;return solo?`<h1>How school reports work</h1><ol><li><b>Open your school</b> below.</li><li><b>Enter the access code</b> the school gave you.</li><li><b>Tap a term</b> to read the report.</li></ol><div class=row onclick="ui.pop=1;render()">${av(s)}<b>${e(s.n)}</b></div>`+(pop?md:''):pop?md:`<div class=cd>${box}</div>`}
function acc(){const s=cur(),h=H(v('ac'));if(h===s.sp){ui.v='dl';return render()}
 const t=s.stu.find(x=>x.c===h);if(t){ui.v='par';ui.ps=t;return render()}alert('Wrong passcode.')}

/* DASHBOARD */
const APPS=[['👩‍🏫','Teachers Access','ta'],['✅','Approvals','ap'],['🗂️','Archive','ar'],['📋','Report Categories','ct'],['🖼️','Report Layouts','ly'],['🎓','Students','sd'],['🔐','Passwords','pw']];
const back=`<button onclick="ui.sec=null;ui.ps=null;ui.vc=ui.vt=ui.vk=null;render()">‹ Dashboard</button>`;
function dash(s){const S=ui.sec;if(!S)return`<h2>${e(s.n)} dashboard</h2><button onclick="ui={};render()">‹ Exit</button>`+APPS.map(a=>`<div class=app onclick="ui.sec='${a[2]}';render()"><i>${a[0]}</i>${a[1]}${a[2]==='ap'&&s.rep.some(r=>r.s==='published')?`<em>${s.rep.filter(r=>r.s==='published').length}</em>`:''}</div>`).join('');
 return back+({ta,ap,ar,ct,ly,sd,pw}[S])(s)}
function ta(s){return`<h2>Teachers Access</h2>${s.tc.map(t=>`<div class=cd><b>${e(t.e)}</b><div class=mu>${e(t.sub||'')} · ${t.cl.join(', ')||'no classes'}</div><button class=x onclick="rmT('${e(t.e)}')">Remove</button></div>`).join('')}<div class=cd><h3>Add teacher</h3><label>Email</label><input id=te type=email><label>Password</label><input id=tw type=password><label>Subjects</label><input id=ts><label>Classes</label><div>${s.cl.map(c=>`<label class=ck><input type=checkbox class=tcl value="${c}">${c}</label>`).join('')}</div><button class=b onclick="addT()">Add</button></div>`}
function addT(){const s=cur(),m=v('te').trim().toLowerCase();if(!m||!v('tw'))return alert('Email and password needed.');if(s.tc.some(t=>t.e===m))return alert('Already added.');s.tc.push({e:m,p:H(v('tw')),sub:v('ts'),cl:[...document.querySelectorAll('.tcl:checked')].map(x=>x.value)});save();render()}
function rmT(m){const s=cur();s.tc=s.tc.filter(t=>t.e!==m);save();render()}
function ap(s){const L=s.rep.filter(r=>r.s==='published');if(ui.rv){const r=s.rep.find(x=>x.id===ui.rv);return`<button onclick="ui.rv=null;render()">‹ List</button>`+rv(s,r)+`<button class="ok nop" onclick="dec('${r.id}','approved')">Approve</button> <button class="x nop" onclick="dec('${r.id}','rejected')">Reject</button>`}
 return`<h2>Approvals</h2>`+(L.map(r=>`<div class=row onclick="ui.rv='${r.id}';render()"><div><b>${e(nm(s,r.stu))}</b><div class=mu>${r.cls} · ${r.t} · ${e(cn(s,r.cat))}</div></div></div>`).join('')||'<p class=mu>Nothing waiting.</p>')}
function dec(i,x){const s=cur();s.rep.find(r=>r.id===i).s=x;save();ui.rv=null;render()}
const nm=(s,i)=>(s.stu.find(x=>x.id===i)||{n:'?'}).n,cn=(s,i)=>(s.rc.find(x=>x.id===i)||{n:'?'}).n;
function ar(s){if(ui.ps)return`<button onclick="ui.ps=null;ui.vc=ui.vt=ui.vk=null;render()">‹ Search</button>`+vw(s,ui.ps);
 const q=(ui.aq||'').toLowerCase(),L=s.stu.filter(t=>q&&t.n.toLowerCase().includes(q)&&s.rep.some(r=>r.stu===t.id&&r.s==='approved'));
 return`<h2>Archive</h2><input id=aq placeholder="Search a learner’s name" value="${e(ui.aq||'')}" oninput="ui.aq=this.value;$('#al').innerHTML=al()"><div id=al>${al()}</div>`}
function al(){const s=cur(),q=(ui.aq||'').toLowerCase();return s.stu.filter(t=>q&&t.n.toLowerCase().includes(q)&&s.rep.some(r=>r.stu===t.id&&r.s==='approved')).map(t=>`<div class=row onclick="ui.ps=s2('${t.id}');render()"><b>${e(t.n)}</b></div>`).join('')||(q?'<p class=mu>No approved reports found.</p>':'')}
const s2=i=>cur().stu.find(x=>x.id===i);
function ct(s){return`<h2>Report Categories</h2>${s.rc.map(c=>`<div class=cd><b>${e(c.n)}</b><div class=mu>${e(c.f.join(', '))}</div><button class=x onclick="rmC('${c.id}')">Delete</button></div>`).join('')}<div class=cd><label>Category name (e.g. End of term)</label><input id=cn><button class=b onclick="addC()">Add category</button></div>`}
function addC(){const s=cur();if(!v('cn').trim())return;s.rc.push({id:uid(),n:v('cn').trim(),f:[],l:''});save();render()}
function rmC(i){const s=cur();s.rc=s.rc.filter(c=>c.id!==i);save();render()}
function ly(s){return`<h2>Report Layouts</h2>${s.rc.map(c=>`<div class=cd><b>${e(c.n)}</b>${c.l?`<img src="${c.l}" style="width:100%;border-radius:8px;margin:8px 0" alt="">`:'<p class=mu>No layout yet.</p>'}<input type=file accept="image/*" onchange="setL('${c.id}',this.files[0])"></div>`).join('')||'<p class=mu>Add a report category first.</p>'}`}
async function setL(i,f){if(!f)return;const s=cur();s.rc.find(c=>c.id===i).l=await img(f,900);save();render()}
function sd(s){const c=ui.sc;return`<h2>Students</h2>`+tabs(s.cl,'sc')+(c?`<h3>${c}</h3>${s.stu.filter(t=>t.c0===c).map(t=>`<div class=row style="cursor:default"><b>${e(t.n)}</b></div>`).join('')||'<p class=mu>No learners yet.</p>'}<div class=cd><label>Learner name</label><input id=sn><label>Parent passcode (a name or number)</label><input id=sp2><button class=b onclick="addS('${c}')">Register learner</button></div>`:'<p class=mu>Tap a class.</p>')}
function addS(c){const s=cur();if(!v('sn').trim()||!v('sp2').trim())return alert('Name and passcode needed.');s.stu.push({id:uid(),n:v('sn').trim(),c0:c,c:H(v('sp2'))});save();render()}
function pw(s){return`<h2>Passwords</h2><div class=cd><label>New school passcode</label><input id=p1 type=password><label>New teachers password</label><input id=p2 type=password><button class=b onclick="chP()">Save</button></div>`}
function chP(){const s=cur();if(v('p1'))s.sp=H(v('p1'));if(v('p2'))s.tp=H(v('p2'));save();alert('Saved.')}

/* REPORT VIEW (approved tabs) */
function vw(s,t){const R=s.rep.filter(r=>r.stu===t.id&&r.s==='approved');let h=`<h3>${e(t.n)}</h3>`;const bk=`<button onclick="if(ui.vk)ui.vk=null;else if(ui.vt)ui.vt=null;else ui.vc=null;render()">‹ Back</button>`;
 if(!R.length)return h+'<p class=mu>No approved reports yet.</p>';
 if(!ui.vc)return h+'<p class=mu>Class</p>'+tabs([...new Set(R.map(r=>r.cls))],'vc');
 const A=R.filter(r=>r.cls===ui.vc);
 if(!ui.vt)return h+bk+tabs(TERMS.filter(x=>A.some(r=>r.t===x)),'vt');
 const B=A.filter(r=>r.t===ui.vt);
 if(!ui.vk)return h+bk+`<p class=mu>${ui.vc} · ${ui.vt}</p>`+tabs([...new Set(B.map(r=>r.cat))].map(i=>({v:i,l:cn(s,i)})),'vk');

/* built-in analyser: OCR in the browser, then Claude, then manual */
const lt=()=>new Promise(r=>{if(window.Tesseract)return r(1);const x=document.createElement('script');x.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js';x.onload=()=>r(1);x.onerror=()=>r(0);document.head.appendChild(x)});
const tmo=(p,t)=>Promise.race([p,new Promise((_,j)=>setTimeout(j,t))]);
async function ocr(u){if(!await lt())throw 0;const w=await tmo(Tesseract.createWorker('eng'),25000);try{return(await tmo(w.recognize(u),90000)).data.text}finally{w.terminate()}}
function parse(t){const Ls=t.split('\n').map(x=>x.replace(/[|_]/g,' ').replace(/\s+/g,' ').trim()).filter(x=>x.length>1),L={title:'',head:[],cols:[],rows:[],sum:[]},i=Ls.findIndex(x=>/subject/i.test(x));if(i<0)throw 0;
 const top=Ls.slice(0,i);L.title=top.find(x=>/result|report/i.test(x))||'';
 top.join(' ').replace(/([A-Za-z][A-Za-z ]{1,24}?)\s*:/g,(m,k)=>{k=k.trim().split(/\s+/).slice(-2).join(' ');if(!/(name|class|term)$/i.test(k)&&!L.head.includes(k))L.head.push(k)});
 L.cols=Ls[i].replace(/subjects?/i,'').trim().split(' ').filter(x=>/^[A-Za-z]+$/.test(x));
 const sm=/^(subjects|total|average|mean|deviation|grade|position|aggregate|division|remarks|points|rank)/i;let j=i+1;
 for(;j<Ls.length&&!sm.test(Ls[j]);j++){const n=Ls[j].split(/\d/)[0].replace(/[^A-Za-z &\/.\-]/g,'').trim().replace(/\s+[A-Z]$/,'');if(n.length>1)L.rows.push(n)}
 for(;j<Ls.length;j++){const l=Ls[j].split(/\d/)[0].trim().replace(/\s+[A-Z]$/,'');if(l.length>1)L.sum.push({l,t:/total/i.test(l)?'sum':/^(number of )?subjects/i.test(l)?'count':/average|mean/i.test(l)?'avg':''})}
 if(!L.rows.length)throw 0;if(!L.cols.length)L.cols=['Marks'];return L}
const fill=j=>{$('#lt').value=j.title||'';$('#lh').value=(j.head||[]).join(', ');$('#lc').value=(j.cols||[]).join(', ');$('#lr').value=(j.rows||[]).join('\n');$('#ls').value=(j.sum||[]).map(x=>x.l+(x.t?'='+x.t:'')).join('\n')};
async function analyse(){const c=curC(),st=$('#ast');st.textContent='Reading the layout\u2026 this can take up to a minute.';
 try{fill(parse(await ocr(c.l)));st.textContent='Read with the built-in analyser. Check the boxes, then Save layout.';return toast('Layout analysed')}catch(_){}
 try{const sm=await claude.use('sample');if(!sm)throw 0;fill(await sm.json('This image is a school report card. Return ONLY JSON: {"title":"heading of the results table, without school name","head":["learner detail labels other than name, class and term"],"cols":["column headings after the Subject column"],"rows":["subject names in order"],"sum":[{"l":"label of each summary row below the table","t":"sum if total marks, count if number of subjects, avg if average, otherwise empty"}]}. Ignore school name, badge, address and the learner\u2019s name, class and term.',{images:[bl(c.l)]}));st.textContent='Read with Claude. Check the boxes, then Save layout.';toast('Layout analysed')}
 catch(_){st.textContent='';toast('Could not read this image here. Type the structure below.',1)}}
render();
